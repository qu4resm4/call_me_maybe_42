[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "llm-sdk",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
]

[tool.mypy]
exclude = "^(\\.venv|build|dist|llm_sdk)/"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
